
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de reservas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Sistema de Gestión
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="servicios.html">Servicios</a>
                <a class="nav-link active" href="reservas.html">Reservas</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2">Gestión de reservas</h1>
        <p class="text-secondary mb-4">
            Registra, consulta y administra las reservas de los clientes.
        </p>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">Registrar reserva</h2>
            </div>

            <div class="card-body">
                <form id="formReserva">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="cliente" class="form-label">
                                Nombre del cliente
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="cliente"
                                required
                                maxlength="100"
                                placeholder="Ingrese el nombre del cliente">
                        </div>

                        <div class="col-md-6">
                            <label for="servicio" class="form-label">
                                Servicio solicitado
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="servicio"
                                required
                                maxlength="100"
                                placeholder="Ingrese el servicio">
                        </div>

                        <div class="col-md-4">
                            <label for="fecha" class="form-label">
                                Fecha de reserva
                            </label>
                            <input
                                type="date"
                                class="form-control"
                                id="fecha"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="hora" class="form-label">
                                Hora de reserva
                            </label>
                            <input
                                type="time"
                                class="form-control"
                                id="hora"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="duracion" class="form-label">
                                Duración (horas)
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="duracion"
                                min="1"
                                max="24"
                                step="1"
                                required
                                placeholder="Ej. 2">
                        </div>

                        <div class="col-md-6">
                            <label for="precio" class="form-label">
                                Precio (S/)
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="precio"
                                min="0.01"
                                step="0.01"
                                required
                                placeholder="Ej. 50.00">
                        </div>

                        <div class="col-md-6">
                            <label for="observaciones" class="form-label">
                                Observaciones
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="observaciones"
                                maxlength="250"
                                placeholder="Opcional">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            Registrar reserva
                        </button>
                        <button type="reset" class="btn btn-outline-secondary">
                            Limpiar
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header">
                <h2 class="h5 mb-0">Reservas registradas</h2>
            </div>

            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label for="buscar" class="form-label">
                            Buscar reserva
                        </label>
                        <input
                            type="search"
                            class="form-control"
                            id="buscar"
                            placeholder="Buscar por cliente o servicio">
                    </div>

                    <div class="col-md-4">
                        <label for="filtroFecha" class="form-label">
                            Filtrar por fecha
                        </label>
                        <input
                            type="date"
                            class="form-control"
                            id="filtroFecha">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Cliente</th>
                                <th>Servicio</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Duración</th>
                                <th>Precio</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReservas">
                            <tr>
                                <td colspan="9" class="text-center text-secondary">
                                    No hay reservas registradas.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="js/validaciones.js"></script>
    <script src="js/reservas.js"></script>
</body>
</html>
