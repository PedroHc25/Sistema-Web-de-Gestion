<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Sistema de Gestión
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link" href="servicios.html">Servicios</a>
                <a class="nav-link" href="reservas.html">Reservas</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Gestión de servicios</h1>
        <p class="text-secondary">
            Registra los servicios de la empresa con su precio y duración.
        </p>

        <div id="mensaje"></div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Registrar servicio</h2>
                        <form id="formServicio" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio (S/)</label>
                                <input type="number" class="form-control" id="precio" min="0" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <label for="duracion" class="form-label">Duración (horas:minutos)</label>
                                <input type="text" class="form-control" id="duracion" placeholder="Ej: 1:30"
                                    inputmode="numeric" required>
                                <div class="form-text">Formato H:MM. Por ejemplo, 1:30 es una hora y media.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Guardar servicio
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3 gap-3">
                            <h2 class="h5 mb-0">Servicios registrados</h2>
                            <input type="search" class="form-control w-50" id="buscador"
                                placeholder="Buscar por nombre">
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th>Precio</th>
                                        <th>Duración</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaServicios"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/servicios.js"></script>
</body>

</html>
